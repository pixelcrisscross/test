name: Step 4

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  find_exercise:
    if: ${{ github.head_ref == 'my-first-branch' && github.event.pull_request.merged == true }}
    name: Find exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: GDGoC VTU GitHub Bootcamp — The First Contribution"

  post_review_content:
    if: ${{ github.event.pull_request.merged == true && github.head_ref == 'my-first-branch' }}
    name: Post completion review
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout exercise repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Checkout Skills exercise templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Post final review
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/x-review.md
      - name: Disable completion workflow
        run: gh workflow disable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    if: ${{ github.event.pull_request.merged == true && github.head_ref == 'my-first-branch' }}
    name: Finish exercise and close tracker issue
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "GDGoC VTU GitHub Bootcamp — The First Contribution"

  reenable_pr_check_if_not_merged:
    if: ${{ github.event.pull_request.merged == false && github.head_ref == 'my-first-branch' }}
    name: Keep the exercise recoverable if the PR is closed without merging
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable Mission 3 workflow
        run: gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Explain how to continue
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: 'This PR was closed without being merged, so the exercise is not complete yet. Reopen this PR after checking your changes, or open a new PR from `my-first-branch` to `main`. Mission 3 has been re-enabled.'
            });
