name: Step 3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  find_exercise:
    if: ${{ github.head_ref == 'my-first-branch' }}
    name: Find exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: GDGoC VTU GitHub Bootcamp — The First Contribution"

  check_step_work:
    if: ${{ github.head_ref == 'my-first-branch' }}
    name: Check pull request
    runs-on: ubuntu-latest
    needs: [find_exercise]
    steps:
      - name: Validate PR title and description
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const title = process.env.PR_TITLE || '';
            const body = process.env.PR_BODY || '';
            const number = Number(process.env.PR_NUMBER);
            const titleOk = title.toLowerCase().includes('add my first profile');
            const bodyOk = body.trim().length > 0;

            const lines = [
              '### GDGoC Bootcamp — automated pull request check',
              '',
              `- ${titleOk ? '✅' : '❌'} PR title contains **Add my first profile**`,
              `- ${bodyOk ? '✅' : '❌'} PR description is not empty`,
              '',
              titleOk && bodyOk
                ? 'All checks passed! The next mission will appear in your exercise issue.'
                : 'Please edit this pull request and fix the failed item(s). This check runs again when you edit the PR.'
            ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: lines.join('\n')
            });

            if (!titleOk || !bodyOk) {
              core.setFailed('The pull request does not meet the exercise requirements yet.');
            }

  post_next_step_content:
    name: Unlock Mission 4
    runs-on: ubuntu-latest
    needs: [find_exercise, check_step_work]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout exercise
        uses: actions/checkout@v6
      - name: Checkout Skills exercise templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Mark Mission 3 complete
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4
      - name: Post Mission 4
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/4-merge-your-pull-request.md
      - name: Post progress instructions
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md
      - name: Enable Mission 4 workflow
        run: gh workflow enable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
