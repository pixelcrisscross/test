name: Step 1

on:
  push:
    branches:
      - my-first-branch

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  find_exercise:
    name: Find exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: GDGoC VTU GitHub Bootcamp — The First Contribution"

  post_next_step_content:
    name: Unlock Mission 2
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout exercise
        uses: actions/checkout@v6
      - name: Checkout Skills exercise templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Mark Mission 1 complete
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2
      - name: Post Mission 2
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/2-commit-a-file.md
      - name: Post progress instructions
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md
      - name: Enable Mission 2 workflow
        run: gh workflow enable "Step 2"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
