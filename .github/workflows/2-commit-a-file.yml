name: Step 2

on:
  push:
    branches:
      - my-first-branch
    paths:
      - PROFILE.md

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  find_exercise:
    name: Find exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3
    with:
      issue-title-text: "Exercise: GDGoC VTU GitHub Bootcamp — The First Contribution"

  validate_profile:
    name: Validate PROFILE.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout participant branch
        uses: actions/checkout@v6
      - name: Check profile file
        shell: bash
        run: |
          set -euo pipefail
          test -s PROFILE.md || { echo "PROFILE.md is missing or empty."; exit 1; }
          grep -qE '^# .+' PROFILE.md || { echo "Add a Markdown heading beginning with '# ' to PROFILE.md."; exit 1; }
          echo "PROFILE.md exists, is non-empty, and contains a Markdown heading."

  post_next_step_content:
    name: Unlock Mission 3
    runs-on: ubuntu-latest
    needs: [find_exercise, validate_profile]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - name: Checkout exercise
        uses: actions/checkout@v6
      - name: Checkout Skills exercise templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3
      - name: Mark Mission 2 complete
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3
      - name: Post Mission 3
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/steps/3-open-a-pull-request.md
      - name: Post progress instructions
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md
      - name: Enable Mission 3 workflow
        run: gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
